<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hunt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <h1 class="logo">Movie Hunt</h1>
            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="Search movies...">
                <button id="mic-btn" aria-label="Voice Search">
                    <span id="mic-icon">🎙️</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="movie-section">
            <h2 class="section-title">Trending Titles</h2>
            <div id="movie-grid" class="movie-grid"></div>
        </section>

        <section class="watchlist-section">
            <h2 class="section-title">Your Watchlist</h2>
            <div id="watchlist-grid" class="movie-grid"></div>
        </section>
    </main>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
